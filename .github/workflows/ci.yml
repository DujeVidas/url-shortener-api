name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://shortener:shortener@127.0.0.1:5432/shortener_test
      REDIS_URL: redis://127.0.0.1:6379/0
      BASE_URL: http://localhost:8000

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check app tests
      
      - name: Check formatting with Ruff
        run: python -m ruff format --check app tests

      - name: Run tests with branch coverage
        run: python -m pytest -v --cov=app --cov-branch --cov-report=term-missing
  
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag url-shortener-api:ci .
      
      - name: Create Compose environment
        run: |
          cp .env.compose.example .env.compose
      
      - name: Validate Docker Compose configuration
        run: |
          docker compose --env-file .env.compose config --quiet
          echo "Docker Compose configuration is valid"


      - name: Start application stack
        run: |
          docker compose --env-file .env.compose up --build -d

      - name: Verify API liveness and readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live \
              && curl --fail --silent http://127.0.0.1:8000/health/ready; then
              echo
              echo "API liveness and readiness checks passed"
              exit 0
            fi

            echo "Waiting for API (attempt $attempt/30)..."
            sleep 2
          done

          echo "API did not become ready"
          docker compose --env-file .env.compose ps
          docker compose --env-file .env.compose logs --no-color
          exit 1

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file .env.compose logs --no-color
      

      - name: Verify complete URL lifecycle
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          destination = "https://example.com/"

          # Create a shortened URL.
          request = urllib.request.Request(
              f"{base_url}/api/v1/urls",
              data=json.dumps({"url": destination}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 201, response.status
              payload = json.load(response)



          # Keep the management token out of CI logs.
          short_code = payload["short_code"]
          management_token = payload["management_token"]

          print("URL creation passed")

          # Prevent urllib from following the redirect automatically.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          try:
              opener.open(f"{base_url}/{short_code}", timeout=10)
              raise AssertionError("Expected an HTTP redirect")
          except urllib.error.HTTPError as response:
              assert response.code == 307, response.code
              assert response.headers["Location"] == destination

          # Verify that analytics are accessible after a redirect.
          analytics_url = f"{base_url}/api/v1/urls/{short_code}/analytics"

          analytics_request = urllib.request.Request(
              analytics_url,
              headers={"X-Management-Token": management_token},
          )

          with urllib.request.urlopen(analytics_request, timeout=10) as response:
              assert response.status == 200, response.status
              analytics = json.load(response)

          assert isinstance(analytics, dict), analytics

          print("Analytics response:", analytics)
          
          # Deactivate the shortened URL.
          delete_request = urllib.request.Request(
              f"{base_url}/api/v1/urls/{short_code}",
              headers={"X-Management-Token": management_token},
              method="DELETE",
          )

          with urllib.request.urlopen(delete_request, timeout=10) as response:
              assert response.status == 204, response.status

          print("URL deactivation passed")

          # Verify that the deactivated URL can no longer redirect.
          try:
              opener.open(f"{base_url}/{short_code}", timeout=10)
              raise AssertionError("Deactivated URL unexpectedly redirected")
          except urllib.error.HTTPError as response:
              assert response.code == 404, (
                  f"Expected 404 Gone, received {response.code}"
              )

          print("Deactivated URL correctly returns 404 Not Found")
          print("Complete URL lifecycle smoke test passed")

          PY
      

      - name: Verify URL creation rate limiting
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          create_url = f"{base_url}/api/v1/urls"

          def create_short_url():
              request = urllib.request.Request(
                  create_url,
                  data=json.dumps({
                      "url": "https://example.com/"
                  }).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      return response.status, response.headers
              except urllib.error.HTTPError as response:
                  return response.code, response.headers

          # A previous smoke test may have already used some quota.
          # Verify the limiter rejects excess requests.
          statuses = []

          for attempt in range(12):
              status, headers = create_short_url()
              statuses.append(status)

              if status == 429:
                  assert headers.get("Retry-After") is not None
                  print("Rate limit enforced with Retry-After header")
                  break
              
              assert status == 201, f"Unexpected status: {status}"

              limit = headers.get("RateLimit-Limit")
              remaining = headers.get("RateLimit-Remaining")
              reset = headers.get("RateLimit-Reset")

              assert limit is not None, "Missing RateLimit-Limit"
              assert remaining is not None, "Missing RateLimit-Remaining"
              assert reset is not None, "Missing RateLimit-Reset"

              assert int(limit) == 10, f"Unexpected limit: {limit}"
              assert 0 <= int(remaining) <= int(limit), (
                  f"Invalid remaining quota: {remaining}"
              )
              assert int(reset) >= 0, f"Invalid reset value: {reset}"

              print(
                  f"Rate-limit headers verified: "
                  f"limit={limit}, remaining={remaining}, reset={reset}"
              )

          else:
              raise AssertionError(
                  f"Expected HTTP 429, got statuses: {statuses}"
              )

          # Health endpoints must remain accessible after the
          # URL creation rate limit has been exceeded.
          for path in ("/health/live", "/health/ready"):
              with urllib.request.urlopen(
                  f"{base_url}{path}",
                  timeout=10,
              ) as response:
                  assert response.status == 200, (
                      f"{path} returned HTTP {response.status}"
                  )

              print(f"{path} remains accessible after rate limiting")

          print("Rate limiting isolation verified")


          print("Rate limiting smoke test passed")
          PY

      - name: Stop application stack
        if: always()
        run: docker compose --env-file .env.compose down

