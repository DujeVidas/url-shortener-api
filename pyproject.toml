[project]
name = "url-shortener-api"
version = "0.1.0"
description = "A production-style URL shortener and analytics API built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "redis>=5.0,<7.0",
    "pytest>=8.0,<10.0",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
markers = [
    "redis_integration: tests requiring a running Redis server",
]